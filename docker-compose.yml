# One-shot migration runners — no long-running container. Each service builds
# the slim runner image, applies pending migrations to the target network's
# database over the Unix socket, and exits (restart: "no").
#
# Deploy:
#   docker compose run --rm mainnet
#   docker compose run --rm testnet
#
# Connection is credential-free: the host Postgres socket dir is bind-mounted
# and the container runs as the host's postgres UID, so peer auth maps to the
# postgres role. Objects are owned by the per-network ecosystem_owner group role
# via PGOPTIONS. Set POSTGRES_UID to the host postgres user's UID (id -u postgres)
# if it isn't the Debian default of 999.
#
# Prerequisites in the target DB (external, superuser): the timestamp9 and http
# extensions, the logical replication subscription, and CREATE on the database
# for the ecosystem_owner role.

x-migrate: &migrate
  build: .
  restart: "no"
  user: "${POSTGRES_UID:-999}"
  volumes:
    - /var/run/postgresql:/var/run/postgresql

services:
  mainnet:
    <<: *migrate
    environment:
      PGHOST: /var/run/postgresql
      PGPORT: "5433"
      PGDATABASE: hedera_mainnet
      PGUSER: postgres
      PGOPTIONS: "-c role=hedera_mainnet_ecosystem_owner"

  testnet:
    <<: *migrate
    environment:
      PGHOST: /var/run/postgresql
      PGPORT: "5432"
      PGDATABASE: hedera_testnet
      PGUSER: postgres
      PGOPTIONS: "-c role=hedera_testnet_ecosystem_owner"
