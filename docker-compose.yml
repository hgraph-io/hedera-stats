# One-shot migration runners — no long-running container. Each service builds
# the slim runner image, applies pending migrations to the target network's
# database over the Unix socket, and exits (restart: "no").
#
# Deploy (ecosystem set, then the public-schema matview set):
#   docker compose run --rm mainnet         &&  docker compose run --rm mainnet-public
#   docker compose run --rm testnet         &&  docker compose run --rm testnet-public
#
# The *-public services apply src/public-migrations as the <db>_owner role (owns
# the public schema, which ecosystem_owner can't write) and track separately in
# public.schema_migrations. Run them AFTER the ecosystem set.
#
# Connection is credential-free: the host Postgres socket dir is bind-mounted
# and the container runs as the host's postgres UID, so peer auth maps to the
# postgres role. Objects are owned by the per-network ecosystem_owner group role
# via PGOPTIONS.
#
# POSTGRES_UID MUST equal the host postgres user's UID (`id -u postgres`) — else
# peer auth fails. Default 26 is the RHEL/Fedora postgres UID; on Debian it's 999.
#
# security_opt label=disable turns off SELinux confinement for the container so
# it can reach the host's Postgres socket (on enforcing hosts the mounted socket
# is otherwise denied with "Permission denied"). This is a short-lived local
# admin container, not a network-facing service.
#
# Prerequisites in the target DB (external, superuser): the timestamp9 and http
# extensions, the logical replication subscription, and CREATE on the database
# for the ecosystem_owner role.

x-migrate: &migrate
  build: .
  # Local, fully-qualified image name so podman uses the just-built image
  # instead of trying to pull an unqualified name (which prompts for a registry).
  image: localhost/hedera-stats-migrate:latest
  pull_policy: build
  restart: "no"
  user: "${POSTGRES_UID:-26}"
  security_opt:
    - label=disable
  volumes:
    - /var/run/postgresql:/var/run/postgresql

services:
  mainnet:
    <<: *migrate
    environment:
      PGHOST: /var/run/postgresql
      PGPORT: "5433"
      PGDATABASE: hedera_mainnet
      PGUSER: postgres
      PGOPTIONS: "-c role=hedera_mainnet_ecosystem_owner"

  testnet:
    <<: *migrate
    environment:
      PGHOST: /var/run/postgresql
      PGPORT: "5432"
      PGDATABASE: hedera_testnet
      PGUSER: postgres
      PGOPTIONS: "-c role=hedera_testnet_ecosystem_owner"

  # Public-schema matview set — applied as the <db>_owner role, tracked in
  # public.schema_migrations (separate from the ecosystem set).
  mainnet-public:
    <<: *migrate
    command: ["bash", "/sql/migrations/migrate.sh", "/sql/public-migrations"]
    environment:
      PGHOST: /var/run/postgresql
      PGPORT: "5433"
      PGDATABASE: hedera_mainnet
      PGUSER: postgres
      PGOPTIONS: "-c role=hedera_mainnet_owner"
      SCHEMA_MIGRATIONS_TABLE: public.schema_migrations

  testnet-public:
    <<: *migrate
    command: ["bash", "/sql/migrations/migrate.sh", "/sql/public-migrations"]
    environment:
      PGHOST: /var/run/postgresql
      PGPORT: "5432"
      PGDATABASE: hedera_testnet
      PGUSER: postgres
      PGOPTIONS: "-c role=hedera_testnet_owner"
      SCHEMA_MIGRATIONS_TABLE: public.schema_migrations
